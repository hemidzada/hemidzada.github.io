name: Daily puzzles

# Adds the new day's Queens, Zip and Tango pages right after midnight in
# Baku (UTC+4) and refreshes archives, guide links and the sitemap.
on:
  schedule:
    - cron: '5 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-daily.mjs
      - name: Commit
        run: |
          git config user.name "panda-daily-bot"
          git config user.email "hello@panda.az"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Daily puzzles $(TZ=Asia/Baku date +%F)"
          git push
